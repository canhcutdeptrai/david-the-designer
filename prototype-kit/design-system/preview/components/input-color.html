<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sd-input-color — Preview</title>


  <link rel="stylesheet" href="../../core/styles/tokens.css">
  <link rel="stylesheet" href="../../core/styles/layout.css">
  <link rel="stylesheet" href="../../core/styles/components.css">
  <link rel="stylesheet" href="../../core/styles/utilities.css">
  <link rel="stylesheet" href="../../core/styles/page-patterns.css">
  <link rel="stylesheet" href="../../core/styles/sd-tokens.css">
</head>
<body>

<div class="app-shell">

  <aside class="sidebar" id="sidebar"></aside>

  <div class="main-area">

    <div data-pattern="page-header" data-variant="browse"
         data-title="sd-input-color"
         data-subtitle="Ô nhập mã màu HEX (bọc sd-input) kèm ô màu xem trước"></div>

    <div class="content-zone">

        <sd-section title="Rỗng và có giá trị">
          <p class="fs-12 text-black400 mb-8">Ô màu hiện caro khi rỗng hoặc mã sai; bấm ô màu mở bảng chọn màu của trình duyệt.</p>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;max-width:980px;">
            <sd-input-color label="Màu nhãn trạng thái"></sd-input-color>
            <sd-input-color label="Màu nhãn trạng thái" value="#AE7129"></sd-input-color>
          </div>
        </sd-section>

        <sd-section title="Lỗi định dạng và bắt buộc">
          <p class="fs-12 text-black400 mb-8"><code>patternErrorMessage</code> cố định trong component.</p>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;max-width:980px;">
            <sd-input-color label="Màu biểu đồ dòng tiền" value="#12Z4"></sd-input-color>
            <sd-input-color label="Màu biểu đồ dòng tiền" required></sd-input-color>
          </div>
        </sd-section>

        <sd-section title="Disabled và viewed">
          <p class="fs-12 text-black400 mb-8">Chế độ xem đi qua <code>sd-view</code> như mọi form control khác.</p>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;max-width:980px;">
            <sd-input-color label="Màu hạn mức" value="#1565C0" disabled></sd-input-color>
            <sd-input-color label="Màu hạn mức" value="#1565C0" viewed></sd-input-color>
          </div>
        </sd-section>


    </div>

  </div>

</div>

<script src="../../sd-components/sd-components.js"></script>
<script src="../../patterns/page-header.js"></script>
<script src="../../patterns/sidebar.js"></script>
<script src="../../core/js/pattern-loader.js"></script>
<script src="../../core/js/shell.js"></script>
<script src="../shared-nav.js"></script>

</body>
</html>
