<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sd-autocomplete — Preview</title>


  <link rel="stylesheet" href="../../core/styles/tokens.css">
  <link rel="stylesheet" href="../../core/styles/layout.css">
  <link rel="stylesheet" href="../../core/styles/components.css">
  <link rel="stylesheet" href="../../core/styles/utilities.css">
  <link rel="stylesheet" href="../../core/styles/page-patterns.css">
  <link rel="stylesheet" href="../../core/styles/sd-tokens.css">
</head>
<body>

<div class="app-shell">

  <aside class="sidebar" id="sidebar"></aside>

  <div class="main-area">

    <div data-pattern="page-header" data-variant="browse"
         data-title="sd-autocomplete"
         data-subtitle="Ô nhập có gợi ý — lọc danh sách tĩnh theo displayField hoặc gọi hàm tìm kiếm phía server"></div>

    <div class="content-zone">

        <sd-section title="Rỗng và đã chọn">
          <p class="fs-12 text-black400 mb-8">Giá trị đã chọn hiện bằng <b>placeholder màu đen</b>, nhãn luôn nổi; nút xoá thay chỗ icon kính lúp.</p>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;max-width:980px;">
            <sd-autocomplete label="Ngân hàng cho vay" items="[{&quot;code&quot;:&quot;VCB&quot;,&quot;name&quot;:&quot;Ngân hàng TMCP Ngoại thương Việt Nam (Vietcombank)&quot;},{&quot;code&quot;:&quot;CTG&quot;,&quot;name&quot;:&quot;Ngân hàng TMCP Công thương Việt Nam (VietinBank)&quot;},{&quot;code&quot;:&quot;VBB&quot;,&quot;name&quot;:&quot;Ngân hàng TMCP Việt Nam Thương Tín (Vietbank)&quot;},{&quot;code&quot;:&quot;VAB&quot;,&quot;name&quot;:&quot;Ngân hàng TMCP Việt Á (VietABank)&quot;,&quot;suspended&quot;:true},{&quot;code&quot;:&quot;ACB&quot;,&quot;name&quot;:&quot;Ngân hàng TMCP Á Châu (ACB)&quot;}]" valueField="code" displayField="name" disabledField="suspended"></sd-autocomplete>
            <sd-autocomplete label="Ngân hàng cho vay" value="VCB" items="[{&quot;code&quot;:&quot;VCB&quot;,&quot;name&quot;:&quot;Ngân hàng TMCP Ngoại thương Việt Nam (Vietcombank)&quot;},{&quot;code&quot;:&quot;CTG&quot;,&quot;name&quot;:&quot;Ngân hàng TMCP Công thương Việt Nam (VietinBank)&quot;},{&quot;code&quot;:&quot;VBB&quot;,&quot;name&quot;:&quot;Ngân hàng TMCP Việt Nam Thương Tín (Vietbank)&quot;},{&quot;code&quot;:&quot;VAB&quot;,&quot;name&quot;:&quot;Ngân hàng TMCP Việt Á (VietABank)&quot;,&quot;suspended&quot;:true},{&quot;code&quot;:&quot;ACB&quot;,&quot;name&quot;:&quot;Ngân hàng TMCP Á Châu (ACB)&quot;}]" valueField="code" displayField="name" disabledField="suspended"></sd-autocomplete>
          </div>
        </sd-section>

        <sd-section title="Panel gợi ý đang mở" subtitle="đang gõ &quot;Viet&quot;; disabledField khoá một dòng — mẫu catalog #c-autocomplete">
          <div style="min-height:230px">
            <div style="width:420px"><sd-autocomplete id="acCatOpen" label="Ngân hàng cho vay" items="[{&quot;code&quot;:&quot;VCB&quot;,&quot;name&quot;:&quot;Ngân hàng TMCP Ngoại thương Việt Nam (Vietcombank)&quot;},{&quot;code&quot;:&quot;CTG&quot;,&quot;name&quot;:&quot;Ngân hàng TMCP Công thương Việt Nam (VietinBank)&quot;},{&quot;code&quot;:&quot;VBB&quot;,&quot;name&quot;:&quot;Ngân hàng TMCP Việt Nam Thương Tín (Vietbank)&quot;},{&quot;code&quot;:&quot;VAB&quot;,&quot;name&quot;:&quot;Ngân hàng TMCP Việt Á (VietABank)&quot;,&quot;suspended&quot;:true},{&quot;code&quot;:&quot;ACB&quot;,&quot;name&quot;:&quot;Ngân hàng TMCP Á Châu (ACB)&quot;}]" valueField="code" displayField="name" disabledField="suspended"></sd-autocomplete></div>
          </div>
        </sd-section>

        <sd-section title="Bắt buộc + lỗi, disabled">
          <p class="fs-12 text-black400 mb-8"><code>disabledField</code> khoá dòng VietABank trong panel (đúng mẫu catalog).</p>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;max-width:980px;">
            <sd-autocomplete label="Ngân hàng nhận" required items="[{&quot;code&quot;:&quot;VCB&quot;,&quot;name&quot;:&quot;Ngân hàng TMCP Ngoại thương Việt Nam (Vietcombank)&quot;},{&quot;code&quot;:&quot;CTG&quot;,&quot;name&quot;:&quot;Ngân hàng TMCP Công thương Việt Nam (VietinBank)&quot;},{&quot;code&quot;:&quot;VBB&quot;,&quot;name&quot;:&quot;Ngân hàng TMCP Việt Nam Thương Tín (Vietbank)&quot;},{&quot;code&quot;:&quot;VAB&quot;,&quot;name&quot;:&quot;Ngân hàng TMCP Việt Á (VietABank)&quot;,&quot;suspended&quot;:true},{&quot;code&quot;:&quot;ACB&quot;,&quot;name&quot;:&quot;Ngân hàng TMCP Á Châu (ACB)&quot;}]" valueField="code" displayField="name" disabledField="suspended"></sd-autocomplete>
            <sd-autocomplete label="Ngân hàng nhận" disabled value="CTG" items="[{&quot;code&quot;:&quot;VCB&quot;,&quot;name&quot;:&quot;Ngân hàng TMCP Ngoại thương Việt Nam (Vietcombank)&quot;},{&quot;code&quot;:&quot;CTG&quot;,&quot;name&quot;:&quot;Ngân hàng TMCP Công thương Việt Nam (VietinBank)&quot;},{&quot;code&quot;:&quot;VBB&quot;,&quot;name&quot;:&quot;Ngân hàng TMCP Việt Nam Thương Tín (Vietbank)&quot;},{&quot;code&quot;:&quot;VAB&quot;,&quot;name&quot;:&quot;Ngân hàng TMCP Việt Á (VietABank)&quot;,&quot;suspended&quot;:true},{&quot;code&quot;:&quot;ACB&quot;,&quot;name&quot;:&quot;Ngân hàng TMCP Á Châu (ACB)&quot;}]" valueField="code" displayField="name" disabledField="suspended"></sd-autocomplete>
          </div>
        </sd-section>

        <sd-section title="Chế độ xem: viewed và viewed='inline'">
          <p class="fs-12 text-black400 mb-8">Inline: <code>sd-view</code> là “mặt”, bấm để mở panel; nút xoá hiện khi rê chuột.</p>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;max-width:980px;">
            <sd-autocomplete label="Ngân hàng cho vay" viewed="true" value="VCB" items="[{&quot;code&quot;:&quot;VCB&quot;,&quot;name&quot;:&quot;Ngân hàng TMCP Ngoại thương Việt Nam (Vietcombank)&quot;},{&quot;code&quot;:&quot;CTG&quot;,&quot;name&quot;:&quot;Ngân hàng TMCP Công thương Việt Nam (VietinBank)&quot;},{&quot;code&quot;:&quot;VBB&quot;,&quot;name&quot;:&quot;Ngân hàng TMCP Việt Nam Thương Tín (Vietbank)&quot;},{&quot;code&quot;:&quot;VAB&quot;,&quot;name&quot;:&quot;Ngân hàng TMCP Việt Á (VietABank)&quot;,&quot;suspended&quot;:true},{&quot;code&quot;:&quot;ACB&quot;,&quot;name&quot;:&quot;Ngân hàng TMCP Á Châu (ACB)&quot;}]" valueField="code" displayField="name" disabledField="suspended"></sd-autocomplete>
            <sd-autocomplete label="Ngân hàng cho vay" viewed="inline" value="VCB" items="[{&quot;code&quot;:&quot;VCB&quot;,&quot;name&quot;:&quot;Ngân hàng TMCP Ngoại thương Việt Nam (Vietcombank)&quot;},{&quot;code&quot;:&quot;CTG&quot;,&quot;name&quot;:&quot;Ngân hàng TMCP Công thương Việt Nam (VietinBank)&quot;},{&quot;code&quot;:&quot;VBB&quot;,&quot;name&quot;:&quot;Ngân hàng TMCP Việt Nam Thương Tín (Vietbank)&quot;},{&quot;code&quot;:&quot;VAB&quot;,&quot;name&quot;:&quot;Ngân hàng TMCP Việt Á (VietABank)&quot;,&quot;suspended&quot;:true},{&quot;code&quot;:&quot;ACB&quot;,&quot;name&quot;:&quot;Ngân hàng TMCP Á Châu (ACB)&quot;}]" valueField="code" displayField="name" disabledField="suspended"></sd-autocomplete>
          </div>
        </sd-section>

        <sd-section title="items là HÀM — tìm kiếm phía server">
          <p class="fs-12 text-black400 mb-8">Gán <code>el.items = fn</code> bằng JS; hàm trả mảng hoặc Promise.</p>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;max-width:980px;">
            <sd-autocomplete id="ac-server" label="Ngân hàng (server)" valueField="code" displayField="name"></sd-autocomplete>
          </div>
        </sd-section>


    </div>

  </div>

</div>

<script src="../../sd-components/sd-components.js"></script>
<script src="../../patterns/page-header.js"></script>
<script src="../../patterns/sidebar.js"></script>
<script src="../../core/js/pattern-loader.js"></script>
<script src="../../core/js/shell.js"></script>
<script src="../shared-nav.js"></script>
<script>
  /* Mẫu catalog: panel mở sẵn với chuỗi đang gõ "Viet" */
  (function () {
    var ac = document.getElementById('acCatOpen'); if (!ac) return;
    var inp = ac.querySelector('input'); if (!inp) return;
    inp.value = 'Viet';
    inp.dispatchEvent(new Event('input', { bubbles: true }));
  })();
  /* Mẫu catalog: ô bắt buộc ở trạng thái touched (hiện lỗi) */
  document.querySelectorAll('sd-autocomplete[required]').forEach(function (el) { el._touched = true; el._render(); });
</script>
<script>
  (function () {
    var BANKS = [
      { code: 'VCB', name: 'Ngân hàng TMCP Ngoại thương Việt Nam (Vietcombank)' },
      { code: 'CTG', name: 'Ngân hàng TMCP Công thương Việt Nam (VietinBank)' },
      { code: 'VBB', name: 'Ngân hàng TMCP Việt Nam Thương Tín (Vietbank)' },
      { code: 'VAB', name: 'Ngân hàng TMCP Việt Á (VietABank)' },
      { code: 'ACB', name: 'Ngân hàng TMCP Á Châu (ACB)' }
    ];
    var el = document.getElementById('ac-server');
    if (el) el.items = function (text) {
      var q = (text || '').toLowerCase();
      return new Promise(function (res) {
        setTimeout(function () {
          res(BANKS.filter(function (b) { return b.name.toLowerCase().indexOf(q) !== -1; }));
        }, 120);
      });
    };
  })();
</script>

</body>
</html>
