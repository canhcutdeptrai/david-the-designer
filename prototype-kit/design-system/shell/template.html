<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{PAGE_TITLE}}</title>


  <link rel="stylesheet" href="../../design-system/core/styles/tokens.css">
  <link rel="stylesheet" href="../../design-system/core/styles/layout.css">
  <link rel="stylesheet" href="../../design-system/core/styles/components.css">
  <link rel="stylesheet" href="../../design-system/core/styles/utilities.css">
  <link rel="stylesheet" href="../../design-system/core/styles/page-patterns.css">
  <link rel="stylesheet" href="../../design-system/core/styles/sd-tokens.css">
</head>
<body>

<!-- ================================================================
     KHUNG TRANG CHUẨN — viết lại 2026-10-14
     Bản trước dựng page-header bằng HTML tay (`.btn` / `button.tab` / `sd-badge type=status`)
     — trái Rule 10 và API catalog. Nay:
       · page-header LUÔN là `data-pattern="page-header"` (xem patterns/page-header.js)
       · nội dung `content-zone` copy từ ai-instructions/generate-skeletons.md đúng loại trang BREAD
       · chỉ dùng `sd-*` (Rule 0) — không `<button>` / `<select>` / `<table>` / `.card` tự dựng
     ================================================================ -->

<div class="app-shell">

  <!-- SIDEBAR — shared-nav.js + patterns/sidebar.js tự dựng -->
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main-area">

    <!-- PAGE HEADER — chọn đúng biến thể:
         Browse: data-variant="browse" data-primary-action="Tạo mới" data-primary-icon="add" data-primary-href="tao-moi.html"
         Read:   data-variant="read" data-record-id="{{RECORD_ID}}" data-badge="{{STATUS}}" data-badge-status="active"
                 (khoá STATUS_MAP → pattern tự vẽ sd-badge color/icon) · chờ duyệt: data-variant="read-approval"
         Edit / Add: data-variant="edit" — nút Bỏ qua + Lưu do pattern sinh
         Tab trong trang: data-page-tabs="Tab 1,Tab 2,Tab 3" -->
    <div data-pattern="page-header" data-variant="browse"
         data-title="{{PAGE_TITLE}}"
         data-primary-action="Tạo mới"
         data-primary-icon="add"></div>

    <!-- CONTENT ZONE — dán skeleton của generate-skeletons.md vào đây -->
    <div class="content-zone">

      <sd-section title="{{SECTION_TITLE}}">
        <p class="mb-0">Nội dung trang.</p>
      </sd-section>

    </div>

  </div>

</div>

<script src="../../design-system/sd-components/sd-components.js"></script>
<script src="../../design-system/patterns/page-header.js"></script>
<script src="../../design-system/patterns/filter-bar.js"></script>
<script src="../../design-system/core/js/pattern-loader.js"></script>
<script src="../../design-system/core/js/shell.js"></script>
<script src="../../design-system/patterns/sidebar.js"></script>
<script src="../shared-nav.js"></script>

</body>
</html>
